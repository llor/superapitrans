# Plantilla: JASARO, S.L.
# CIF: B16189946
#
# Características del PDF:
#   - Cabecera de empresa alineada arriba a la derecha (líneas 1-5).
#   - Sección "CARGA" y "DESCARGA" en columnas paralelas.
#   - Mercancía y Precio en la misma línea con la etiqueta a la izquierda.
#   - Email y teléfono del operador NO aparecen en este PDF.

empresa: "JASARO, S.L."

match:
  all:
    - "JASARO,S.L."
    - "B16189946"

fields:
  cliente:
    tipo: lineas
    numeros: [1, 2, 3, 4, 5]
    join: " — "

  carga:
    tipo: columna
    start_pattern: '^CARGA\s+DESCARGA'
    end_pattern: '^Mercancía:'
    column: left
    split_anchor: "DESCARGA"
    drop_patterns:
      - '^https?://'
      - '^Nº Pedido'
    join: " — "

  descarga:
    tipo: columna
    start_pattern: '^CARGA\s+DESCARGA'
    end_pattern: '^Mercancía:'
    column: right
    split_anchor: "DESCARGA"
    drop_patterns:
      - '^Nº Pedido'
    join: " — "

  mercancia:
    tipo: regex
    pattern: '^Mercancía:\s+(.+)$'
    flags: [multiline]

  precio:
    tipo: regex
    pattern: '^Precio:\s+(.+)$'
    flags: [multiline]

  email:
    tipo: regex
    pattern: '[\w.+-]+@[\w-]+\.[\w.-]+'

  telefono:
    # En este PDF aparece "Teléfono: 961985599" pero es del transportista
    # (TRANSPALOMARES), no del operador (JASARO). Se deja vacío.
    tipo: regex
    pattern: '(?!)'
