# =============================================
# chofocles — Docker Compose
# =============================================
# Mismo fichero para dev y prod. La detección dev/prod la hace .env
# (copiado de .env-dev / .env-prod por el script de despliegue).
#
# Conexión a PostgreSQL:
#   chofocles comparte instancia con el resto de productos Saycu,
#   conectándose al contenedor `system-postgres` por la red externa
#   `system_postgres_net`. Las BBDDs son `saycu_admin` y
#   `saycu_chofocles_<CODIGO>` (una por tenant).

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: chofocles_api
    env_file:
      - .env
    ports:
      - "${PORT}:${PORT}"
    networks:
      - chofocles_net
      - postgres_net
      - superapitrans_net
    volumes:
      - documentos:/var/chofocles/documentos
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT}/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  ingestor:
    build:
      context: .
      dockerfile: ingestor/Dockerfile
    container_name: chofocles_ingestor
    env_file:
      - .env
    networks:
      - chofocles_net
      - postgres_net
    volumes:
      - documentos:/var/chofocles/documentos
    restart: unless-stopped
    depends_on:
      - api

  panel:
    build:
      context: .
      dockerfile: panel/Dockerfile
      args:
        # URL pública del API. Detrás de system-caddy, va al subdominio api.
        # Valor inyectado por docker compose desde la variable VITE_API_BASE
        # del .env del proyecto.
        VITE_API_BASE: "${VITE_API_BASE:?VITE_API_BASE requerido (ej: https://dev-api.superapi.eoden.es/chofocles)}"
    container_name: chofocles_panel
    networks:
      - superapitrans_net
    restart: unless-stopped

networks:
  chofocles_net:
    name: chofocles_network
    driver: bridge
  postgres_net:
    external: true
    name: system_postgres_net
  superapitrans_net:
    external: true
    name: superapitrans_network

volumes:
  documentos:
    name: chofocles_documentos
